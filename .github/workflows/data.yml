name: data
# Daily: load SEC + EIA data, run the analysis, rebuild the dashboard (docs/), commit it.
# Agent evaluation (calls the Claude API, costs cents) runs only when requested.
on:
  schedule:
    - cron: "17 15 * * *"        # 15:17 UTC daily
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the Claude agent evaluation (uses the Anthropic API)"
        type: boolean
        default: false
      run_memo:
        description: "Have the agent write this week's research memo (uses the Anthropic API)"
        type: boolean
        default: false
      full_backfill:
        description: "Re-download all history instead of incremental"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      # The database persists between runs in the Actions cache, so daily loads are incremental.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/follow_the_power.db
          key: ftp-db-${{ github.run_id }}
          restore-keys: ftp-db-

      - name: Load data (SEC + EIA + weather)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # SEC fair-access policy: name + contact email
        run: python -m ftp.pipeline ${{ github.event.inputs.full_backfill == 'true' && '--full' || '' }}

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/follow_the_power.db
          key: ftp-db-${{ github.run_id }}

      - name: Analysis report
        run: python -m ftp.report

      - name: Open dataset + SEC diagnostics
        if: always()
        run: |
          python -m ftp.export
          python -m ftp.diagnose

      - name: Agent evaluation (Claude)
        if: ${{ github.event.inputs.run_evals == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ftp.evals --judge

      - name: Research memo (Claude)
        if: ${{ github.event.inputs.run_memo == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m ftp.memo

      - name: Build dashboard
        run: python -m ftp.dashboard

      - name: Commit dashboard and eval results
        run: |
          git config user.name "follow-the-power bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ evals/ reports/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily data refresh"
          # main may have moved while this ran (e.g. a code push): rebase the data commit on top, retry
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ftp_db, path: data/follow_the_power.db, retention-days: 7 }

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "Data run failed in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
          else gh issue create --title "Data run failed" --body "Logs: $RUN_URL"; fi
