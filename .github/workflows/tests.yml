name: tests
on:
  push:
    paths-ignore: ["docs/**", "evals/**", "reports/**"]   # data refresh commits don't need a test run
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest-cov
      - name: Tests (offline; synthetic data + scripted fake LLM)
        run: pytest -q --cov=ftp --cov-report=term --cov-report=markdown:coverage.md
      - name: Coverage summary
        if: always()
        run: test -f coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true
